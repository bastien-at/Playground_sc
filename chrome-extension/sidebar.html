<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mailbot</title>
  <link rel="stylesheet" href="sidebar.css"/>
</head>
<body>

<!-- ========== VUE : ACCUEIL ========== -->
<div id="viewHome" class="mb-view">

  <header class="mb-header">
    <div class="mb-logo">
      <!-- SparkSolid -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" stroke="none" aria-hidden="true">
        <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/>
        <path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/>
      </svg>
    </div>
    <div class="mb-header-text">
      <div class="mb-header-name">Mailbot</div>
      <div class="mb-header-sub" id="headerSub">Connecté · prêt</div>
    </div>
    <button class="mb-icon-btn" id="closeDrawer" aria-label="Fermer" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <div class="mb-ticket-strip">
    <div class="mb-ticket-icon-wrap">
      <!-- Mail -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
      </svg>
    </div>
    <div class="mb-ticket-info">
      <div class="mb-ticket-meta">
        <span class="mb-ticket-id" id="ticketId">--</span>
        <span class="mb-sep">·</span>
        <span class="mb-lang-tag" id="ticketLang">--</span>
        <span class="mb-sep">·</span>
        <span class="mb-priority mb-priority--none" id="ticketPriority">--</span>
      </div>
      <div class="mb-ticket-subject" id="ticketSubject">En attente d'un ticket…</div>
    </div>
  </div>

  <main class="mb-main">

    <div class="mb-section-row">
      <span class="mb-section-label">Que veux-tu faire ?</span>
      <span class="mb-ai-pill">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
          <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/>
        </svg>
        IA prête
      </span>
    </div>

    <div class="mb-grid-2x2">

      <!-- Générer une réponse (IA — action principale) -->
      <button class="mb-card mb-card--ai" id="generateBtn" type="button">
        <div class="mb-card-icon mb-card-icon--ai">
          <!-- Bolt / éclair -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 2L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <div class="mb-card-name">Générer une réponse</div>
          <div class="mb-card-desc">Mailbot rédige tout</div>
        </div>
        <span class="mb-card-badge">IA</span>
      </button>

      <!-- Apporter une réponse (bientôt) -->
      <button class="mb-card" type="button" disabled>
        <div class="mb-card-icon">
          <!-- Draft / crayon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/>
          </svg>
        </div>
        <div>
          <div class="mb-card-name">Apporter une réponse</div>
          <div class="mb-card-desc">Mon brouillon → reformulé</div>
        </div>
      </button>

      <!-- Synthèse du fil (bientôt) -->
      <button class="mb-card" type="button" disabled>
        <div class="mb-card-icon">
          <!-- Summary / liste -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h13M4 12h13M4 18h9"/>
            <circle cx="20" cy="6" r="1.4"/><circle cx="20" cy="12" r="1.4"/><circle cx="16" cy="18" r="1.4"/>
          </svg>
        </div>
        <div>
          <div class="mb-card-name">Synthèse du fil</div>
          <div class="mb-card-desc">3 bullets pour briefer</div>
        </div>
      </button>

      <!-- Traduire (bientôt) -->
      <button class="mb-card" type="button" disabled>
        <div class="mb-card-icon">
          <!-- Globe -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
          </svg>
        </div>
        <div>
          <div class="mb-card-name">Traduire</div>
          <div class="mb-card-desc">Détecte la langue, traduit</div>
        </div>
      </button>

    </div><!-- /.mb-grid-2x2 -->

    <!-- Contexte du message (collapsible) -->
    <details class="mb-context" id="contextDetails" open>
      <summary>
        <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 6l6 6-6 6"/>
        </svg>
        Contexte du message
      </summary>
      <div class="mb-context-body">
        <textarea
          class="mb-textarea"
          id="emailText"
          placeholder="Texte de l'email client (optionnel — capturé depuis Salesforce)"
          rows="4"
        ></textarea>
        <div class="mb-row-2">
          <div class="mb-field">
            <label class="mb-label" for="firstname">Prénom</label>
            <input class="mb-input" id="firstname" type="text" placeholder="Prénom"/>
          </div>
          <div class="mb-field">
            <label class="mb-label" for="lastname">Nom</label>
            <input class="mb-input" id="lastname" type="text" placeholder="Nom"/>
          </div>
        </div>
      </div>
    </details>

    <div class="mb-status" id="homeStatus"></div>

  </main>

  <footer class="mb-footer">
    <span class="mb-dot-ok"></span>
    <span>n8n · OK</span>
    <span class="mb-footer-right">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
      </svg>
      <span id="footerTime">--</span>
    </span>
  </footer>

</div><!-- /#viewHome -->


<!-- ========== VUE : RÉPONSE ========== -->
<div id="viewResponse" class="mb-view" hidden>

  <header class="mb-header">
    <button class="mb-icon-btn" id="backToHome" aria-label="Retour" type="button">
      <!-- ArrowLeft -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6"/>
      </svg>
    </button>
    <div class="mb-header-text">
      <div class="mb-header-name">Réponse générée</div>
      <div class="mb-header-sub" id="responseSubtitle">Mailbot · IA</div>
    </div>
    <button class="mb-icon-btn tooltip" id="regenerateBtn" aria-label="Régénérer" type="button" data-tooltip="Régénérer">
      <!-- Refresh -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
      </svg>
    </button>
  </header>

  <div class="mb-ticket-strip">
    <div class="mb-ticket-icon-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
      </svg>
    </div>
    <div class="mb-ticket-info">
      <div class="mb-ticket-meta">
        <span class="mb-ticket-id" id="ticketIdResp">--</span>
        <span class="mb-sep">·</span>
        <span class="mb-lang-tag" id="ticketLangResp">--</span>
        <span class="mb-sep">·</span>
        <span class="mb-priority mb-priority--none" id="ticketPriorityResp">--</span>
      </div>
      <div class="mb-ticket-subject" id="ticketSubjectResp">--</div>
    </div>
  </div>

  <div class="mb-response-scroll">

    <!-- Bannière verdict juge (injectée dynamiquement) -->
    <div id="judgeBannerWrap"></div>

    <!-- Réponse proposée -->
    <div class="mb-section-row">
      <span class="mb-section-label">Réponse proposée</span>
      <span class="mb-ai-pill" id="respLangBadge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
          <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/>
        </svg>
        IA
      </span>
    </div>
    <textarea
      class="mb-textarea mb-response-ta"
      id="n8nSuggestion"
      placeholder="La réponse générée apparaîtra ici"
      readonly
    ></textarea>

    <!-- Notes du juge (injectées dynamiquement) -->
    <div id="judgeNotesWrap">
      <div class="mb-section-row">
        <span class="mb-section-label">Notes du juge</span>
      </div>
      <div id="judgeNotes" style="display:flex;flex-direction:column;gap:4px;margin-top:4px;"></div>
    </div>

    <!-- Panneau juge legacy (caché — maintenu pour compatibilité JS) -->
    <div id="judgePanel" hidden>
      <div class="judgeRow">
        <span id="agentStatusBadge">-</span>
        <span id="judgeDecisionBadge">-</span>
        <span id="judgeScore">-</span>
      </div>
      <div><div id="judgeProgress"></div></div>
      <div id="judgeComment"></div>
    </div>

    <!-- Catégorisation -->
    <div id="categorizationPanel" hidden>
      <div class="mb-section-row" style="margin-top:6px">
        <span class="mb-section-label">Catégorisation</span>
      </div>
      <div class="mb-cat-grid">
        <div class="mb-cat-item" id="categorieItem" hidden>
          <div class="mb-cat-label">Catégorie</div>
          <div class="mb-cat-value" id="categorieValue">-</div>
        </div>
        <div class="mb-cat-item" id="sousCategorieItem" hidden>
          <div class="mb-cat-label">Sous-catégorie</div>
          <div class="mb-cat-value" id="sousCategorieValue">-</div>
        </div>
        <div class="mb-cat-item" id="prioriteItem" hidden>
          <div class="mb-cat-label">Priorité</div>
          <div class="mb-cat-value" id="prioriteValue">-</div>
        </div>
        <div class="mb-cat-item" id="actionItem" hidden>
          <div class="mb-cat-label">Action recommandée</div>
          <div class="mb-cat-value" id="actionValue">-</div>
        </div>
      </div>
    </div>

    <!-- Statut + actions -->
    <div class="mb-status" id="mailbotStatus"></div>

    <div class="mb-action-row">
      <button class="mb-btn mb-btn--secondary" id="regenerateBtnAlt" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
        </svg>
        Régénérer
      </button>
      <button class="mb-btn mb-btn--primary tooltip" id="copySuggestion" type="button" data-tooltip="Copier dans le presse-papiers">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>
        </svg>
        Copier
      </button>
    </div>

  </div><!-- /.mb-response-scroll -->

  <footer class="mb-footer">
    <span class="mb-dot-ok"></span>
    <span>n8n · OK</span>
    <span class="mb-footer-right">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
      </svg>
      <span id="footerTime2">--</span>
    </span>
  </footer>

</div><!-- /#viewResponse -->

<input type="hidden" id="n8nWebhookUrl" value=""/>
<script src="sidebar.js"></script>
</body>
</html>
