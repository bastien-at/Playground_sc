<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SF Sidebar</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <div class="shell">
      <header class="drawerHeader">
        <div class="drawerHeaderInner">
          <img
            src="https://assets-cdn-frz.alltricks.com/images/2022_ALLTRICKS_QUADRI_ORIGINAL_BLANC.svg?1769675087"
            alt="Alltricks"
            class="drawerLogo"
          />
          <button
            class="drawerClose"
            id="closeDrawer"
            type="button"
            aria-label="Fermer"
          >
            ×
          </button>
        </div>
      </header>

      <main class="main">
        <div class="subtitle" id="subtitle">Chargement…</div>

        <button class="btn btnPrimary btnLarge tooltip" id="sendTicketToMailbot" style="width: 100%;" data-tooltip="Génère une réponse automatique basée sur le contexte du ticket">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          Générer une réponse
        </button>

        <div class="status" id="mailbotStatus"></div>

        <section class="card" id="responseSection" hidden>
          <div class="cardTitle">Réponse générée</div>
          <textarea
            class="textarea textareaPrimary"
            id="n8nSuggestion"
            placeholder="La réponse générée apparaîtra ici"
            readonly
            style="margin-top: 0;"
          ></textarea>

          <div class="judge" id="judgePanel" hidden>
            <div class="judgeRow">
              <span class="badge" id="agentStatusBadge">-</span>
              <span class="badge" id="judgeDecisionBadge">-</span>
              <span class="judgeScore" id="judgeScore">-</span>
            </div>
            <div class="progress" aria-hidden="true">
              <div class="progressBar" id="judgeProgress"></div>
            </div>
            <div class="judgeComment" id="judgeComment"></div>
          </div>

          <div class="categorization" id="categorizationPanel" hidden>
            <div class="cardTitle" style="margin-top: 16px; margin-bottom: 8px;">Catégorisation</div>
            <div class="categorizationGrid">
              <div class="categorizationItem" id="categorieItem" hidden>
                <div class="categorizationLabel">Catégorie</div>
                <div class="categorizationValue" id="categorieValue">-</div>
              </div>
              <div class="categorizationItem" id="sousCategorieItem" hidden>
                <div class="categorizationLabel">Sous-catégorie</div>
                <div class="categorizationValue" id="sousCategorieValue">-</div>
              </div>
              <div class="categorizationItem" id="prioriteItem" hidden>
                <div class="categorizationLabel">Priorité</div>
                <div class="categorizationValue" id="prioriteValue">-</div>
              </div>
              <div class="categorizationItem" id="actionItem" hidden>
                <div class="categorizationLabel">Action recommandée</div>
                <div class="categorizationValue" id="actionValue">-</div>
              </div>
            </div>
          </div>

          <button class="btn btnPrimary tooltip" id="copySuggestion" data-tooltip="Copie la réponse dans le presse-papiers" style="width: 100%; margin-top: 16px;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            Copier
          </button>
        </section>

        <section class="card">
          <div class="cardTitle">Contexte du message</div>
          
          <textarea
            class="textarea"
            id="emailText"
            placeholder="Texte de l'email client"
            style="margin-top: 0; min-height: 100px;"
          ></textarea>

          <div class="actionsGroup" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;">
            <div class="field" style="gap: 6px;">
              <div class="label">Prénom</div>
              <input
                class="input"
                id="firstname"
                type="text"
                placeholder="Prénom"
              />
            </div>
            <div class="field" style="gap: 6px;">
              <div class="label">Nom</div>
              <input
                class="input"
                id="lastname"
                type="text"
                placeholder="Nom"
              />
            </div>
          </div>

          <input
            class="input"
            id="n8nWebhookUrl"
            type="hidden"
            value=""
          />
        </section>

      </main>
    </div>

    <script src="sidebar.js"></script>
  </body>
</html>
